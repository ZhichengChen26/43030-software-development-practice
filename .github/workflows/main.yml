name: 43030 Software Development Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking 43030 Software Development project..."
          test -f README.md
          test -f index.html
          echo "README.md found"
          echo "index.html found"
          echo "Project check completed successfully!"
